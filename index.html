<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finora | مدیریت مالی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="logo">FINORA</div><div class="sub">دفترچه مدیریت مالی شخصی + سرمایه‌گذاری</div></div>
    <button class="btn" data-act="live">↻ بازار</button>
  </header>
  <div class="monthbar">
    <button class="btn" data-act="mprev">ماه قبل</button>
    <span id="mlabel"></span>
    <button class="btn" data-act="mnext">ماه بعد</button>
  </div>
  <nav class="nav">
    <button class="active" data-p="home">🏠 خانه</button>
    <button data-p="wallet">💳 کیف پول</button>
    <button data-p="invest">📈 سرمایه‌گذاری</button>
    <button data-p="analysis">📊 تحلیل</button>
    <button data-p="settings">⚙️ تنظیمات</button>
  </nav>
  <section id="home" class="page active"></section>
  <section id="wallet" class="page"></section>
  <section id="invest" class="page"></section>
  <section id="analysis" class="page"></section>
  <section id="settings" class="page"></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
