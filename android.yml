name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: '[ -d android ] || npx cap add android'

      - name: Add notification permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf8').read()
          perms=['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','VIBRATE']
          add=''.join('    <uses-permission android:name="android.permission.%s" />\n'%x for x in perms if 'android.permission.%s"'%x not in s)
          if add:
              s=s.replace('<application',add+'    <application',1)
              open(p,'w',encoding='utf8').write(s)
          print(s)
          PY

      - name: Generate app icons
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: finora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
